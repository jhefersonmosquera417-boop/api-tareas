<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tareas</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; flex-direction: column; gap: .5rem; margin-bottom: 1.5rem; }
    li { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
    .hecha { text-decoration: line-through; color: #888; }
    .espacio { flex: 1; }
  </style>
</head>
<body>
  <div id="app">
    <h1>Tareas</h1>
    <form @submit.prevent="crear">
      <input v-model="titulo" placeholder="Título" required>
      <input v-model="descripcion" placeholder="Descripción (opcional)">
      <button>Agregar</button>
    </form>
    <p v-if="error" style="color:red">{{ error }}</p>
    <ul>
      <li v-for="t in tareas" :key="t.id">
        <input type="checkbox" :checked="t.completada" @change="alternar(t)">
        <span class="espacio" :class="{ hecha: t.completada }">
          {{ t.titulo }} <small v-if="t.descripcion">- {{ t.descripcion }}</small>
        </span>
        <button @click="editar(t)">Editar</button>
        <button @click="eliminar(t)">Eliminar</button>
      </li>
    </ul>
  </div>
  <script>
    // ref crea variables reactivas: al cambiar su .value, Vue actualiza la pantalla
    const { createApp, ref, onMounted } = Vue;
    createApp({
      setup() {
        const tareas = ref([]);
        const titulo = ref("");
        const descripcion = ref("");
        const error = ref("");

        // Función auxiliar para no repetir fetch + manejo de errores
        async function api(url, opciones = {}) {
          const r = await fetch(url, {
            headers: { "Content-Type": "application/json" },
            ...opciones,
          });
          if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error ||
            r.statusText);
          return r.status === 204 ? null : r.json();
        }

        async function cargar() {
          try {
            tareas.value = await api("/api/tareas");
            error.value = "";
          } catch (e) {
            error.value = e.message;
          }
        }

        async function crear() {
          try {
            await api("/api/tareas", {
              method: "POST",
              body: JSON.stringify({ titulo: titulo.value, descripcion: descripcion.value }),
            });
            titulo.value = "";
            descripcion.value = "";
            await cargar();
          } catch (e) {
            error.value = e.message;
          }
        }

        async function alternar(t) {
          try {
            await api(`/api/tareas/${t.id}`, {
              method: "PUT",
              body: JSON.stringify({ completada: !t.completada }),
            });
            await cargar();
          } catch (e) {
            error.value = e.message;
          }
        }

        async function editar(t) {
          const nuevo = prompt("Nuevo título:", t.titulo);
          if (!nuevo) return;
          try {
            await api(`/api/tareas/${t.id}`, {
              method: "PUT",
              body: JSON.stringify({ titulo: nuevo }),
            });
            await cargar();
          } catch (e) {
            error.value = e.message;
          }
        }

        async function eliminar(t) {
          try {
            await api(`/api/tareas/${t.id}`, { method: "DELETE" });
            await cargar();
          } catch (e) {
            error.value = e.message;
          }
        }

        // onMounted se ejecuta una vez cuando la página ya cargó
        onMounted(cargar);
        return { tareas, titulo, descripcion, error, crear, alternar, editar, eliminar };
      },
    }).mount("#app");
  </script>
</body>
</html>
